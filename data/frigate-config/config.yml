        # "high FFmpeg CPU usage" in the UI (CameraFfmpegThreshold,
        # web/src/types/graph.ts). Decode is essentially all of a camera's
        # ffmpeg CPU here -- the scale filter, the rawvideo pipe and the segment
        # muxer together are under 1% -- so the source encode is the only lever
        # short of hardware acceleration, which the podman VM does not have.
        # Measured, 30s of stream: 1080p High 30.5%, 1080p Baseline 19.7%
        # (too close to the threshold to be stable), 720p Baseline 9.2%.
        #
        # debug/media is gitignored, so regenerate this file with:
        #   ffmpeg -i embassey_bag.mp4 -vf scale=1280:720 -c:v libx264 \
        #     -profile:v baseline -level 3.1 -preset slow -crf 21 -g 48 \
        #     -c:a copy -movflags +faststart embassey_bag_720p_baseline.mp4
