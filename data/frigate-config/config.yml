  EmbassyGate:
    enabled: true
    ffmpeg:
      inputs:
        - path: /media/streams/streams/safety/embassey_bag.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
    detect:
      enabled: true
      fps: 10  # Increased from 5 to 10 for better temporal consistency and smoother tracking
      min_initialized: 3  # Require 3 consecutive detections before creating new ID (reduces false IDs)
      max_disappeared: 50  # Keep tracking for 5 seconds after object disappears (handles brief gaps)

      # Stationary object handling - important for person placing handbag and standing still
      stationary:
        threshold: 20  # Consider stationary after 2 seconds without movement (20 frames at 10fps)
        interval: 10   # Re-check stationary objects every 1 second
        # Note: max_frames removed - not supported in camera-specific config in v0.17.0

    motion:
      threshold: 25
      contour_area: 10
      improve_contrast: true

    objects:
      track:
        - person
        - handbag
      # Object-specific filters to prevent ID switching and false detections
      filters:
        person:
          min_area: 5000    # Minimum ~70x70 pixels (filters out tiny false detections)
          max_area: 200000  # Maximum ~447x447 pixels (prevents entire scene being detected)
          threshold: 0.60   # Require 60% confidence (only strong detections, prevents flickering)
        handbag:
          min_area: 1000    # Minimum ~31x31 pixels (realistic handbag size)
          max_area: 50000   # Maximum ~223x223 pixels (prevents large false detections)
          threshold: 0.50   # Require 50% confidence (balanced for smaller objects)

version: 0.17-0
