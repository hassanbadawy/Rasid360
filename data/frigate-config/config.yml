      enabled: true
      # fps, width and height come from the global detect block: 5 fps at
      # 1280x720. This camera used to carry its own fps: 10 -- halved 2026-08-29
      # when it was running 27 detections/sec against a CPU detector at ~40 ms
      # each. See wiki/operations/configuration.md.
      min_initialized: 3  # Require 3 consecutive detections before creating new ID (reduces false IDs)
      max_disappeared: 50  # Keep tracking for 5 seconds after object disappears (handles brief gaps)

      # Stationary object handling - important for person placing handbag and standing still
      stationary:
        threshold: 20  # 4 seconds without movement at 5fps
        interval: 10   # Re-check stationary objects every 1 second
        # Note: max_frames removed - not supported in camera-specific config in v0.17.0

    # motion comes from the global block (40/40): this camera is where those
    # numbers were measured.

    objects:
      track:
        - person
        - handbag
      # Object-specific filters to prevent ID switching and false detections
      # Areas are fractions of the frame, not pixels. Frigate reads any value
      # below 1 as a fraction and multiplies it by the detect resolution
      # (convert_area_to_pixels, frigate/config/config.py), so these survive the
      # 1080p -> 720p change above. As pixel counts they would not: the same
      # bounding box covers 2.25x fewer pixels at 720p, so the old min_area of
      # 5000 would have filtered out every person on this camera.
      filters:
        person:
          min_area: 0.0024  # ~0.24% of frame, was 5000 px at 1080p
          max_area: 0.0965  # ~9.7% of frame, was 200000 px at 1080p
          threshold: 0.60   # Require 60% confidence (only strong detections, prevents flickering)
        handbag:
          min_area: 0.00048 # ~0.05% of frame, was 1000 px at 1080p
          max_area: 0.0241  # ~2.4% of frame, was 50000 px at 1080p
          threshold: 0.50   # Require 50% confidence (balanced for smaller objects)

    zones:
      embredzone:
        coordinates: 
          0.101,0.406,0.793,0.394,0.82,0.516,0.958,0.533,0.997,0.645,0.995,0.99,0.062,0.99,0.091,0.822,0.027,0.645
        loitering_time: 0
        objects:
          - handbag
          - person
        friendly_name: EmbRedZone

