semantic_search:
  enabled: false
  model_size: small
classification:
  object:
    enabled: false
version: 0.17-0
# Review items decide what footage is kept: a segment is retained because it
# overlaps a review item, and the `record:` windows above only decide for how
# long. Violations always create one, so these switches govern ordinary person
# and car activity, not violation evidence.
#
# Both default to ON (upstream default), and are editable at
# Settings -> Cameras -> Recording.
#
# Know the cost before leaving them on for a busy camera: on continuously busy
# footage an ordinary review segment never *closes* -- its end_time stays NULL,
# and expire_review_segments filters on `end_time < cutoff`, which NULL never
# satisfies -- so it is immortal and pins every recording it overlaps. Measured
# on this deployment's looping road fixtures: 220 GB/day, of which 93% overlapped
# no violation at all. Turn them off per camera if that is the shape of your
# traffic.
