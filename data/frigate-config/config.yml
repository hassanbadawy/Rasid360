# to check events http://localhost:5001/api/events?camera=EmbassyGate&label=person or mqtt topic: frigate/EmbassyGate/person
mqtt:
  enabled: true
  host: mqtt

# Detectors configuration
detectors:
  cpu:
    type: cpu

# Logger configuration
logger:
  default: debug
  logs:
    frigate.experimental: debug

# Recording configuration - only violation footage is kept.
#
# `enabled: true` runs the capture pipeline; it does NOT mean footage is stored.
# ffmpeg always writes segments to cache, and the retention windows below decide
# what survives. Setting `enabled: false` deletes segments immediately and makes
# violation clips impossible, so leave it on and control storage with the days
# values.
record:
  enabled: true

  # Run the expiry pass every 10 minutes rather than the default 60. With
  # near-continuous detections and `detections.retain.days: 0`, every detection
  # still causes its segments to be moved to permanent storage first and deleted
  # at the next expiry -- so the expiry interval, not the retention window, sets
  # how much churn sits on disk. At the measured rate 60 minutes was ~10 GB.
  expire_interval: 10

  # No continuous recording.
  continuous:
    days: 0

  # No motion buffer. This used to be 0.5 days purely so violation clips had
  # something to point at, because violations never created review items. They
  # do now (see frigate/track/object_processing.py), so violation footage is
  # retained by the alerts window below and this buffer is no longer load-bearing.
  motion:
    days: 0

  # Violations land here: they are created as alert-severity review items.
  # mode must be `all`, not `motion` -- a no_parking_violation is a stationary
  # car, so motion mode discards exactly the footage the rule exists to capture.
  alerts:
    retain:
      days: 2
      mode: all
    pre_capture: 5
    post_capture: 5

  # Don't retain normal detection recordings.
  detections:
    retain:
      days: 0
      mode: motion
    pre_capture: 5
    post_capture: 5

# Snapshot configuration - Disable automatic snapshots
# Manual violation events will still capture snapshots via include_recording
snapshots:
  enabled: false

# Objects to track - detect vehicles in addition to person
objects:
  track:
    - person
    - car
    - bus
    - truck
    - motorcycle
  filters:
    person:
      min_area: 50
      threshold: 0.25
    car:
      min_area: 200
      threshold: 0.25
    bus:
      min_area: 300
      threshold: 0.25
    motorcycle:
      min_area: 10
      threshold: 0.25
    bicycle:
      min_area: 10
      threshold: 0.25
    handbag:
      min_area: 10
      threshold: 0.25

# Detect configuration with tracker for stable object tracking
# Improves ID consistency and reduces ID switching
detect:
  enabled: true
  fps: 5

  # Cap the detect frame for every camera. Without these, a camera that omits
  # them detects at its *source* resolution -- which is how EmbassyGate silently
  # ran at 1920x1080 while every other camera ran 720p. All six Road cameras set
  # exactly this, so it belongs here; LPR_Camera and face_camera override it.
  #
  # This is a detect-side saving (smaller shm frames, less work in
  # frigate.process), NOT an ffmpeg one. Frigate scales after decoding, in the
  # same process, so the full-size frame is decoded regardless -- measured
  # 28.7% -> 31.6% on EmbassyGate. Decode cost is a property of the source
  # encode; see wiki/operations/configuration.md.
  #
  # Coupled to objects.filters: min_area/max_area are areas of the *detect*
  # frame, so a camera with pixel-valued filters breaks if this changes. Write
  # them as fractions (values < 1) and they follow the resolution instead.
  width: 1280
  height: 720
  # Optional: Number of consecutive detection hits required for an object to be initialized in the tracker. (default: 1/2 the frame rate)
  min_initialized: 2
  # Optional: Number of frames without a detection before Frigate considers an object to be gone. (default: 5x the frame rate)
  max_disappeared: 30
  stationary:
    threshold: 10  # Frames before considering stationary
    interval: 10   # Frames between stationary checks

motion:
  # Frigate's defaults (threshold 30, contour_area 10) are far too sensitive for
  # these scenes: noise, shadows and light flicker each become a motion blob, and
  # every blob is another inference call on the CPU detector at ~40 ms. Measured
  # on EmbassyGate 2026-08-29, raising both cut regions per frame 2.86 -> 2.06.
  # Cameras that need more sensitivity override it -- Road01 (80/50, a busy
  # street) and LPR_Camera (15/5, plates on stopped vehicles).
  threshold: 40
  contour_area: 40
  improve_contrast: true

lpr:
  enabled: true
  min_area: 1500  # Ignore plates with an area (length x width) smaller than 1500 pixels
  min_plate_length: 4  # Only recognize plates with 4 or more characters
  # known_plates:
  #   Employees Cars:
  #     - "ABC-1234"
  #     - "ABC-I234"  # Accounts for potential confusion between the number one (1) and capital letter I
  #     - "J*N-*234"  # Matches JHN-1234 and JMN-I234, but also note that "*" matches any number of characters
  #     - "[S5]LL 1234"  # Matches both SLL 1234 and 5LL 1234
  #   Work Trucks:
  #     - "EMP-[0-9]{3}[A-Z]"  # Matches plates like EMP-123A, EMP-456Z

# Global face recognition configuration
face_recognition:
  enabled: true
  model_size: small
  unknown_score: 0.8
  detection_threshold: 0.7
  recognition_threshold: 0.9
  min_area: 500
  min_faces: 1
  save_attempts: 100
  blur_confidence_filter: true

