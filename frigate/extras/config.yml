# Frigate Extras Configuration
# Custom Event Detection System

# MQTT Broker Configuration
mqtt:
  host: mqtt             # MQTT broker hostname (mqtt service name inside container)
  port: 1883             # MQTT broker port
  client_id: frigate_extras
  # username: mqtt_user  # Optional: MQTT authentication
  # password: mqtt_pass  # Optional: MQTT authentication

# Frigate API Configuration
frigate:
  api_url: http://localhost:5000/api  # Frigate API endpoint (port 5000 inside container)

# Action Handlers Configuration
actions:
  # DSL-Based Violation Detection System
  # Flexible, configurable violation rules without code changes
  dsl_violations:
    enabled: true

    # Global violation templates (reusable across cameras)
    violation_templates:

      # Wrong-way vehicle detection (zone sequence)
      wrong_way:
        type: zone_sequence
        description: "Vehicle moves from valid zones to violation zone"
        vehicle_types: [car, bus, truck, motorcycle]
        from_zones: "{from}"  # Template parameter
        to_zone: "{to}"       # Template parameter
        duration: 30
        severity: high
        cooldown: 600         # for real camera feed make it number less than 60 sec we made it high to avoid duplicate alerts in testing

      # Object logic violation (boolean conditions)
      missing_safety_equipment:
        type: object_logic
        description: "Hazard detected without required safety equipment"
        condition: "detected({hazard}) AND NOT detected({safety})"
        monitor_duration: 0
        duration: 30
        severity: critical
        cooldown: 30

      # Zone + object violation
      restricted_zone:
        type: zone_object
        description: "Objects detected in restricted zone"
        condition: "in_zone({zone}) AND detected({object})"
        duration: 20
        severity: medium
        cooldown: 600

      # Fall down detection (aspect ratio based)
      fall_detection:
        type: fall_down
        description: "Person fall detected based on width/height ratio"
        object_type: person
        width_height_ratio: "{ratio}"  # Template parameter: ratio threshold
        min_duration: "{duration}"     # Template parameter: sustained duration
        duration: 30
        severity: critical
        cooldown: 600

      # Stationary vehicle in no-parking/no-stop zone
      stationary_vehicle:
        type: sustained_condition
        description: "Vehicle stopped in no-parking or no-stop zone"
        condition: "in_zone({zone}) AND (detected(car) OR detected(bus) OR detected(truck)
          OR detected(motorcycle))"
        monitor_duration: "{duration}"  # Template parameter: how long vehicle must be stationary
        duration: 30
        severity: high
        cooldown: 600

      # Speed limit violation (uses Frigate's built-in speed estimation)
      # Note: Zone must be configured with 'distances' field for speed estimation to work
      speed_limit:
        type: sustained_condition
        description: "Vehicle exceeding speed limit in calibrated zone"
        condition: "in_zone({zone}) AND (detected(car) OR detected(bus) OR detected(truck)
          OR detected(motorcycle))"
        speed_threshold: "{limit}"  # Template parameter: speed limit in km/h
        monitor_duration: 2  # Check speed for at least 2 seconds
        duration: 30
        severity: high
        cooldown: 600

    # Camera-specific violations
    cameras:
      Road01:
        violations:
          # Wrong-way detection: vehicles moving from zone01 or zone02 to wrongzone
          - name: wrongway
            enabled: true  # Enable/disable this specific violation
            type: zone_sequence
            description: "Vehicles moving from zone01/zone02 to wrongzone"
            vehicle_types: [car, bus, truck, motorcycle]
            from_zones: [zone01, zone02]
            to_zone: wrongzone
            duration: 30
            severity: high
            cooldown: 600

      Road02:
        violations:
          # Fall down detection: person with width/height ratio > 1.2 for 3 seconds
          - name: person_fall_down
            enabled: true  # Enable/disable this specific violation
            type: fall_down
            description: "Person fall detected"
            object_type: person
            width_height_ratio: 1.2
            min_duration: 3
            duration: 30
            severity: critical
            cooldown: 600

      Road03:
        violations:
          # No parking zone violation: vehicle stopped for more than 5 seconds
          - name: no_parking_violation
            enabled: true
            type: sustained_condition
            description: "Vehicle stopped in No_Parking zone for more than 5 seconds"
            condition: "in_zone(no_parking) AND (detected(car) OR detected(bus) OR
              detected(truck) OR detected(motorcycle))"
            monitor_duration: 5  # Vehicle must be stationary for 5 seconds
            duration: 30
            severity: high
            cooldown: 600

          # No stop zone violation: vehicle stopped for more than 3 seconds
          - name: no_stop_violation
            enabled: true
            type: sustained_condition
            description: "Vehicle stopped in No_Stop zone for more than 3 seconds"
            condition: "in_zone(no_stop) AND (detected(car) OR detected(bus) OR detected(truck)
              OR detected(motorcycle))"
            monitor_duration: 3  # Vehicle must be stationary for 3 seconds
            duration: 30
            severity: high
            cooldown: 600

          # Speed limit violation: vehicle exceeding 80 km/h in speed estimation zone
          # Uses Frigate's built-in speed estimation (zone must have 'distances' configured)
          - name: speed_limit_violation
            enabled: true
            type: sustained_condition
            description: "Vehicle exceeding 80 km/h speed limit"
            condition: "in_zone(speed_estimation) AND (detected(car) OR detected(bus)
              OR detected(truck) OR detected(motorcycle))"
            speed_threshold: 80  # Configurable: speed limit in km/h
            monitor_duration: 2  # Vehicle must exceed speed for 2 seconds
            duration: 30
            severity: high
            cooldown: 600

      Road04:
        violations:
          # Wrong-way detection: vehicles moving from zone01 or zone02 to wrongzone
          - name: wrongway
            enabled: true  # Enable/disable this specific violation
            type: zone_sequence
            description: "Vehicles moving in wrong direction"
            vehicle_types: [car, bus, truck, motorcycle]
            from_zones: [rightcomeend]
            to_zone: rightcomestart
            duration: 3
            severity: high
            cooldown: 600

      Road05:
        violations:
          # Wrong-way detection: vehicles moving from rightcomeend to rightcomestart
          - name: wrongway_right
            enabled: true  # Enable/disable this specific violation
            type: zone_sequence
            description: "Vehicles moving in wrong direction (right lane)"
            vehicle_types: [car, bus, truck, motorcycle]
            from_zones: [rightcomeend]
            to_zone: rightcomestart
            min_detections: 2  # Require 2 consecutive detections (adjusted for zone flickering)
            duration: 3
            severity: high
            cooldown: 600

          # Wrong-wa4/0Ab32j93592qUtdUU4_fJ_zn9oCID8LxGxL0vE8hMQriLIDji27EeDNU7mOxfz85-27dm_Ay detection: vehicles moving from leftcomeend to leftcomestart
          - name: wrongway_left
            enabled: true  # Enable/disable this specific violation
            type: zone_sequence
            description: "Vehicles moving in wrong direction (left lane)"
            vehicle_types: [car, bus, truck, motorcycle]
            from_zones: [leftcomeend]
            to_zone: leftcomestart
            min_detections: 2  # Require 2 consecutive detections (adjusted for zone flickering)
            duration: 3
            severity: high
            cooldown: 600

      EmbassyGate:
        violations:
          # Red zone violation: person or handbag in embredzone for 2 seconds
          - name: red_zone_intrusion
            enabled: true  # Enable this violation
            type: zone_object
            description: "Person or handbag detected in EmbRedZone for 2 seconds"
            condition: "in_zone(embredzone) AND (detected(person) OR detected(handbag))"
            duration: 2  # Trigger after 2 seconds of continuous detection in zone
            severity: high
            cooldown: 600  # Wait 60 seconds before triggering again (prevents duplicate detections on looping video)

      Road06:
        violations:
          # Aggressive turn: vehicle moving from no_exit_zone to exit_zone (dangerous maneuver)
          - name: aggressive_turn
            enabled: true
            type: zone_sequence
            description: "Vehicle making aggressive turn from No_Exit_Zone to Exit_Zone"
            vehicle_types: [car, bus, truck, motorcycle]
            from_zones: [no_exit_zone]
            to_zone: exit_zone
            min_detections: 2  # Require 2 consecutive detections to avoid false positives
            duration: 30
            severity: high
            cooldown: 600

          # No stop zone violation: vehicle stopped for more than 3 seconds
          - name: no_stop_zone_violation
            enabled: true
            type: sustained_condition
            description: "Vehicle stopped in No_Stop_Zone for more than 3 seconds"
            condition: "in_zone(no_stop_zone) AND (detected(car) OR detected(bus)
              OR detected(truck) OR detected(motorcycle))"
            monitor_duration: 3  # Vehicle must be stationary for 3 seconds
            duration: 30
            severity: high
            cooldown: 600

# Logging Configuration
logging:
  level: DEBUG  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: /tmp/frigate_extras.log
