services:
  devcontainer:
    # Check host system's actual render/video/plugdev group IDs with 'getent group render', 'getent group video', and 'getent group plugdev'
    # Must add these exact IDs in container's group_add section or OpenVINO GPU acceleration will fail
    group_add:
      - "109" # render
      - "110" # render
      - "44"  # video
      - "46"  # plugdev
    # Frigate sizes a shared-memory frame ring from this. 256mb held only 12
    # frames for this camera set (7 enabled, one 1080p) against the 50 it wants
    # -- 2.4s of buffer at 5fps -- and it warned "should be increased to at
    # least 370 MB". 370 buys 20 frames; 512 buys 28 (~5.6s) with room for a
    # camera or two.
    #
    # Full 50 frames would need ~896mb, and tmpfs actually occupies what it
    # holds: ~800 MB resident on a 7.45 GiB machine that has already OOM-killed
    # Frigate once. Not worth it here. Recompute after changing cameras:
    #   calculate_shm_requirements() in frigate/util/services.py
    shm_size: "512mb"
    # The UI's Restart button SIGTERMs pid 1 (s6-svscan), so s6 shuts the whole
    # container down -- that is by design, and production relies on the restart
    # policy to bring it straight back. Without one here, pressing Restart
    # stopped the dev stack permanently.
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/main/Dockerfile
      # Use target devcontainer-trt for TensorRT dev
      target: devcontainer
    ## Uncomment this block for nvidia gpu support
    # deploy:
    #       resources:
    #           reservations:
    #               devices:
    #                   - driver: nvidia
    #                     count: 1
    #                     capabilities: [gpu]
    # environment:
    #   YOLO_MODELS: ""
    # devices:
      # - /dev/video0:/dev/video0 # laptop webcam
      # - /dev/bus/usb:/dev/bus/usb # Uncomment for Google Coral USB
      # - /dev/dri:/dev/dri # for intel hwaccel, needs to be updated for your hardware
    volumes:
      - .:/workspace/frigate:cached
      - ./web/dist:/opt/frigate/web:cached
      - /etc/localtime:/etc/localtime:ro
      - ./debug/media:/media/streams:ro
      # /config comes from data/frigate-config. There used to be a second
      # ./config:/config mount above this one; docker silently let the last
      # definition win, but podman rejects duplicate mount destinations with
      # "Error: /config: duplicate mount destination".
      - ./data/frigate-config:/config
      - ./data/frigate-storage:/media/frigate
     # - /dev/bus/usb:/dev/bus/usb # Uncomment for Google Coral USB
    ports:
      - 5173:5173 # dev frontend
      - "8971:8971"
      - "5001:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
  
  #    - "8555:8555/tcp" # WebRTC over tcp
   #   - "8555:8555/udp" # WebRTC over udp
    #  - "1935:1935" # RTMP feeds
      # - 5321:5321

  mqtt:
    image: eclipse-mosquitto:2.0
    command: mosquitto -c /mosquitto-no-auth.conf # enable no-auth mode
    ports:
      - "1883:1883"

  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./data/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - ./data/home-assistant/run/dbus:/run/dbus:ro
    ports:
      - 8123:8123
networks:
 default:
   driver: bridge